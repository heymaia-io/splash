# Komga test server for the iOS port (plan Phase 0 fixture).
# Usage: ./setup.sh   (generates CBZs, starts server, seeds libraries/collection/readlist)
name: splash-fixture
services:
  komga:
    image: gotson/komga:latest
    container_name: splash-komga
    ports:
      - "25601:25600"
    volumes:
      - ./data/config:/config
      - ./data/libraries:/data:ro
      # Optional personal library (set KOMGA_EXTRA_LIBRARY_DIR in the gitignored .env). Always read-only.
      - ${KOMGA_EXTRA_LIBRARY_DIR:-./data/no-extra}:/extra:ro
    environment:
      - TZ=UTC
    restart: "no"
